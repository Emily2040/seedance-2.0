# Validation-only dependencies for scripts/schema_check.py.
#
# Hash-pinned and installable on the platforms a maintainer or the CI runner
# actually uses: CPython 3.11-3.13 on Linux (x86-64, aarch64), macOS (Intel and
# Apple silicon), and Windows (x86-64).
#
# Every package here except rpds-py is a pure-Python wheel, so one hash covers
# every platform. rpds-py ships compiled wheels, so each supported interpreter
# and platform contributes its own hash; pip selects the single wheel that
# matches the host and verifies it against this set. Supporting another
# platform means adding its hashes, never relaxing the check.
#
# The skill package itself never needs these. Nothing under skills/,
# references/, or scripts/ that ships to users imports jsonschema.
#
# To refresh: python -m pip install --dry-run --report - jsonschema for the
# pure-Python pins, then take each supported rpds-py wheel hash from PyPI.


name: validate-seedance-skill

on:
  push:
  pull_request:
  workflow_dispatch:

# The validation suite only reads the tree. Withholding every other scope means
# a compromised dependency or script cannot push, open pull requests, or
# publish packages with this token.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # validate_skills.py fails when it finds committed bytecode. Keeping
      # __pycache__ out of the tree stops any step that imports a module from
      # changing the result of a later step.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/seedance-pycache
    steps:
      # Actions are pinned to commit SHAs: a tag is mutable, so `@v4` silently
      # changes what executes here. The trailing comment tracks the release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-validation.lock
      # Only scripts/schema_check.py needs a third-party package. The lock is
      # hash-pinned for this exact runner and Python version.
      - name: Install validation dependencies
        run: python -m pip install --require-hashes --requirement requirements-validation.lock
      - name: Validate skill metadata and required files
        run: python scripts/validate_skills.py --strict
      - name: Audit stale and risky active wording
        run: python scripts/content_audit.py --strict
      - name: Validate eval schema
        run: python scripts/eval_schema_check.py --strict
      - name: Execute JSON Schemas against declared instances
        run: python scripts/schema_check.py --strict
      - name: Audit frontend README and SVG assets
        run: python scripts/design_audit.py --strict
      - name: Check the masthead matches its generator
        run: python scripts/build_hero.py --check
      - name: Validate source freshness and claim labels
        run: python scripts/source_registry_check.py --strict
      - name: Validate multilingual vocabulary schema
        run: python scripts/vocab_schema_check.py --strict
      - name: Validate sequence project state
        run: python scripts/project_state_check.py --strict
      - name: Validate continuity chains
        run: python scripts/continuity_chain_check.py --strict
      - name: Validate behavior contracts
        run: python scripts/behavior_contract_check.py --strict
      - name: Validate sequence evals
        run: python scripts/sequence_eval_check.py --strict
      - name: Validate generation-run fixtures
        run: python scripts/generation_run_check.py --strict
      - name: Lint compiled prompts
        run: python scripts/prompt_lint.py --self-test --strict
      - name: Stress-test the prompt architecture
        run: python scripts/prompt_architecture_stress.py --strict
      - name: Check eval harness wiring (offline)
        run: python scripts/eval_run.py --self-test --strict
      - name: Check frame-extraction tool wiring (offline)
        run: python scripts/extract_last_frame.py --self-test --strict
      # The decoded-frame regression must exercise a real executable. Export
      # the verified path and a handoff marker so the unit-test step fails
      # closed if this provisioning step is removed or reordered.
      - name: Provision FFmpeg for decoded-frame tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # `acl` makes the real extended-access-ACL publication regression
          # deterministic instead of silently skipping on the hosted runner.
          sudo apt-get install --yes --no-install-recommends acl ffmpeg
          ffmpeg_path="$(command -v ffmpeg)"
          test -x "$ffmpeg_path"
          "$ffmpeg_path" -hide_banner -version
          {
            printf 'SEEDANCE_TEST_FFMPEG=%s\n' "$ffmpeg_path"
            printf 'SEEDANCE_CI_FFMPEG_PROVISIONED=1\n'
          } >> "$GITHUB_ENV"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall scripts tests
      - name: Check diff whitespace
        run: git diff --check

  linux-privileged-frame-publication:
    # A root process on the hosted VM still lacks CAP_SYS_ADMIN. Run only the
    # success-path metadata regressions in an immutable, explicitly privileged
    # container; the ordinary job above proves unprivileged refusal behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # ubuntu:24.04 linux/amd64 manifest published 2026-07-02.
      image: ubuntu@sha256:52df9b1ee71626e0088f7d400d5c6b5f7bb916f8f0c82b474289a4ece6cf3faf
      options: --privileged
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/seedance-privileged-pycache
    steps:
      - name: Provision the pinned privileged runtime
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends \
            acl \
            attr \
            ca-certificates \
            ffmpeg \
            git \
            libcap2-bin \
            python3
          python3 --version
          ffmpeg -hide_banner -version
          setfacl --version
          getfacl --version
          setfattr --version
          getfattr --version
          capsh --print
          {
            printf 'SEEDANCE_TEST_FFMPEG=%s\n' "$(command -v ffmpeg)"
            printf 'SEEDANCE_CI_FFMPEG_PROVISIONED=1\n'
          } >> "$GITHUB_ENV"
      # Actions are pinned to commit SHAs. Checkout runs only after the
      # container's Git and CA runtime has been provisioned explicitly.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prove privileged filesystem and publication prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0
          command -v python3
          command -v ffmpeg
          command -v setfacl
          command -v getfacl
          command -v setfattr
          command -v getfattr
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(workspace / "scripts"))
          import extract_last_frame as extractor

          assert os.geteuid() == 0, os.geteuid()
          assert extractor._linux_has_effective_cap_sys_admin(), Path(
              "/proc/self/status"
          ).read_text(encoding="ascii")
          assert extractor._posix_descriptor_xattr_api_supported()
          assert extractor._posix_atomic_exchange_supported()

          with tempfile.TemporaryDirectory(prefix="seedance-privileged-proof-") as raw:
              root = Path(raw)
              probe = root / "policy-probe"
              probe.write_bytes(b"descriptor-bound")
              descriptor = os.open(probe, os.O_RDWR)
              try:
                  trusted_name = "trusted.seedance-ci-proof"
                  trusted_value = b"visible"
                  os.setxattr(descriptor, trusted_name, trusted_value)
                  assert trusted_name in os.listxattr(descriptor)
                  assert os.getxattr(descriptor, trusted_name) == trusted_value
                  os.removexattr(descriptor, trusted_name)
                  assert trusted_name not in os.listxattr(descriptor)
              finally:
                  os.close(descriptor)

              subprocess.run(
                  ["setfattr", "-n", "user.seedance-ci-proof", "-v", "visible", probe],
                  check=True,
              )
              subprocess.run(
                  ["getfattr", "-n", "user.seedance-ci-proof", probe], check=True
              )
              subprocess.run(
                  ["setfacl", "-m", "u:12345:r--", probe], check=True
              )
              subprocess.run(["getfacl", probe], check=True)
              assert "system.posix_acl_access" in os.listxattr(probe)

              distinct_uid = 65534 if os.geteuid() != 65534 else 65533
              distinct_gid = 65534 if os.getegid() != 65534 else 65533
              os.chown(probe, distinct_uid, distinct_gid)
              changed = probe.stat()
              assert changed.st_uid == distinct_uid, changed
              assert changed.st_gid == distinct_gid, changed

              left = root / "exchange-left"
              right = root / "exchange-right"
              left.write_bytes(b"left")
              right.write_bytes(b"right")
              directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
              try:
                  extractor._posix_exchange_names(
                      left.name, directory, right.name, directory
                  )
                  assert left.read_bytes() == b"right"
                  assert right.read_bytes() == b"left"
                  extractor._posix_exchange_names(
                      left.name, directory, right.name, directory
                  )
                  assert left.read_bytes() == b"left"
                  assert right.read_bytes() == b"right"
              finally:
                  os.close(directory)

          assert extractor._posix_descriptor_xattrs_supported()
          print(
              "proved CAP_SYS_ADMIN, descriptor trusted.* xattrs, POSIX ACLs, "
              "distinct UID/GID ownership, and renameat2(RENAME_EXCHANGE)"
          )
          PY
      - name: Run privileged Linux metadata-preservation regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import unittest

          os.chdir(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts"))
          import extract_last_frame as extractor

          assert extractor._posix_descriptor_xattrs_supported(), (
              "effective CAP_SYS_ADMIN, descriptor xattrs, or atomic exchange unavailable"
          )
          names = [
              "tests.test_extract_frame_output_policy.OutputCollisionCliTests.test_force_replaces_only_after_successful_decode",
              "tests.test_extract_frame_output_policy.OutputCollisionCliTests.test_force_decode_failure_preserves_existing_output",
              "tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_force_publish_error_preserves_old_output_and_cleans_stage",
              "tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_force_rechecks_a_late_input_alias",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_verify_to_link_stage_rename_swap_cannot_publish_attacker_inode",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_preserves_existing_owner_group_and_mode",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_preserves_user_extended_attributes",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_preserves_extended_access_acl",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_holds_verified_target_descriptor_through_decode",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_auxiliary_names_fit_name_max_14_with_unicode_output",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_swap_after_final_verify_is_rolled_back_without_overwrite",
              "tests.test_extract_frame_output_policy.PosixPublicationTests.test_force_policy_error_after_anchor_link_cleans_owned_anchor",
              "tests.test_extract_last_frame.RealFfmpegFrameTests.test_existing_output_is_replaced_with_the_true_final_frame",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              for test, reason in result.skipped:
                  print(f"PRIVILEGED REGRESSION SKIPPED: {test}: {reason}", file=sys.stderr)
              raise SystemExit("privileged metadata regressions must not skip")
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Check diff whitespace
        run: git diff --check

  windows-frame-publication:
    # Keep the complete validation suite on Linux, but execute the native
    # handle-locking and publication primitives on the platform they protect.
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Provision and verify FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $ffmpeg) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not provision FFmpeg"
            }
            $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop |
              Select-Object -First 1
          }
          $ffmpegPath = $ffmpeg.Source
          if (-not (Test-Path -LiteralPath $ffmpegPath -PathType Leaf)) {
            throw "Resolved FFmpeg path is not an executable file: $ffmpegPath"
          }
          & $ffmpegPath -hide_banner -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg version probe failed"
          }
          "SEEDANCE_TEST_FFMPEG=$ffmpegPath" >> $env:GITHUB_ENV
          "SEEDANCE_CI_FFMPEG_PROVISIONED=1" >> $env:GITHUB_ENV
      - name: Prove the runner uses native Win32 semantics
        run: python -c "import os, sys; assert os.name == 'nt' and sys.platform == 'win32', (os.name, sys.platform)"
      - name: Run native Win32 publication regressions
        run: >-
          python -m unittest -v
          tests.test_extract_frame_output_policy.OutputCollisionCliTests.test_windows_near_name_max_stage_is_bounded_before_decode
          tests.test_extract_frame_output_policy.OutputCollisionCliTests.test_windows_long_unicode_output_publishes_with_cp1252_console
          tests.test_extract_frame_output_policy.OutputCollisionCliTests.test_windows_device_and_normalization_aliases_are_refused
          tests.test_extract_frame_output_policy.ConsoleOutputTests.test_error_text_is_escaped_for_legacy_console_encoding
          tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_prewrite_hardlink_swap_cannot_redirect_generated_bytes
          tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_verify_to_publish_swap_is_blocked_by_exclusive_handle
          tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_collision_after_final_validation_is_atomically_refused
          tests.test_extract_frame_output_policy.AdversarialPublicationTests.test_cleanup_deletes_by_handle_not_swapped_path
      - name: Run real-FFmpeg frame publication suites
        run: >-
          python -m unittest -v
          tests.test_extract_last_frame
          tests.test_extract_frame_output_policy.RealProtectedPipelineTests
      - name: Check diff whitespace
        run: git diff --check

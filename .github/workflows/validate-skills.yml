name: validate-seedance-skill

on:
  push:
  pull_request:
  workflow_dispatch:

# The validation suite only reads the tree. Withholding every other scope means
# a compromised dependency or script cannot push, open pull requests, or
# publish packages with this token.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # validate_skills.py fails when it finds committed bytecode. Keeping
      # __pycache__ out of the tree stops any step that imports a module from
      # changing the result of a later step.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/seedance-pycache
    steps:
      # Actions are pinned to commit SHAs: a tag is mutable, so `@v4` silently
      # changes what executes here. The trailing comment tracks the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-validation.lock
            requirements-masthead.lock
      # GitHub actions and this explicit wheel download can use the network.
      # Before repository validation, both locks are constrained to pinned
      # package/hash syntax. Pip receives an empty environment plus /dev/null as
      # its config file, so global/site config cannot add find-links or indexes.
      - name: Validate offline wheel-lock grammar
        run: env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -S -B scripts/build_masthead_outlines.py --validate-wheel-lock requirements-validation.lock --validate-wheel-lock requirements-masthead.lock
      - name: Download hash-locked validation and masthead wheels
        run: |
          env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -m pip --disable-pip-version-check download --only-binary=:all: --index-url https://pypi.org/simple --require-hashes --dest "$RUNNER_TEMP/seedance-wheelhouse" --requirement requirements-validation.lock
          env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -m pip --disable-pip-version-check download --only-binary=:all: --index-url https://pypi.org/simple --require-hashes --dest "$RUNNER_TEMP/seedance-wheelhouse" --requirement requirements-masthead.lock
      - name: Install validation dependencies without package-index access
        run: env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -m pip --disable-pip-version-check install --force-reinstall --no-index --find-links "$RUNNER_TEMP/seedance-wheelhouse" --require-hashes --requirement requirements-validation.lock
      - name: Force-install masthead build dependencies without package-index access
        run: env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -S -B scripts/build_masthead_outlines.py --install-build-deps --wheelhouse "$RUNNER_TEMP/seedance-wheelhouse" --build-env "/tmp/seedance-masthead-venv-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Validate skill metadata and required files
        run: python scripts/validate_skills.py --strict
      - name: Audit stale and risky active wording
        run: python scripts/content_audit.py --strict
      - name: Validate eval schema
        run: python scripts/eval_schema_check.py --strict
      - name: Execute JSON Schemas against declared instances
        run: python scripts/schema_check.py --strict
      - name: Audit frontend README and SVG assets
        run: python scripts/design_audit.py --strict
      - name: Check masthead outline provenance
        run: env -i PATH="$PATH" HOME="$HOME" PIP_CONFIG_FILE=/dev/null python -I -S -B scripts/build_masthead_outlines.py --check --build-env "/tmp/seedance-masthead-venv-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check the masthead matches its generator
        run: python -I -S -B scripts/build_hero.py --check
      - name: Validate source freshness and claim labels
        run: python scripts/source_registry_check.py --strict
      - name: Validate multilingual vocabulary schema
        run: python scripts/vocab_schema_check.py --strict
      - name: Validate sequence project state
        run: python scripts/project_state_check.py --strict
      - name: Validate continuity chains
        run: python scripts/continuity_chain_check.py --strict
      - name: Validate behavior contracts
        run: python scripts/behavior_contract_check.py --strict
      - name: Validate sequence evals
        run: python scripts/sequence_eval_check.py --strict
      - name: Validate generation-run fixtures
        run: python scripts/generation_run_check.py --strict
      - name: Lint compiled prompts
        run: python scripts/prompt_lint.py --self-test --strict
      - name: Stress-test the prompt architecture
        run: python scripts/prompt_architecture_stress.py --strict
      - name: Check eval harness wiring (offline)
        run: python scripts/eval_run.py --self-test --strict
      - name: Check frame-extraction tool wiring (offline)
        run: python scripts/extract_last_frame.py --self-test --strict
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall scripts tests
      - name: Check diff whitespace
        run: git diff --check

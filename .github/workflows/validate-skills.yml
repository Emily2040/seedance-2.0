name: validate-seedance-skill

on:
  push:
  pull_request:
  workflow_dispatch:

# The validation suite only reads the tree. Withholding every other scope means
# a compromised dependency or script cannot push, open pull requests, or
# publish packages with this token.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # validate_skills.py fails when it finds committed bytecode. Keeping
      # __pycache__ out of the tree stops any step that imports a module from
      # changing the result of a later step.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Actions are pinned to commit SHAs: a tag is mutable, so `@v4` silently
      # changes what executes here. The trailing comment tracks the release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-validation.lock
      # `runner` context is not available while GitHub evaluates job-level
      # `env`. Resolve RUNNER_TEMP after the runner and Python are available,
      # then export the value for every later validation step.
      - name: Route Python bytecode outside the checkout
        shell: python
        run: |
          import os
          from pathlib import Path

          cache = Path(os.environ["RUNNER_TEMP"]) / "seedance-pycache"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              print(f"PYTHONPYCACHEPREFIX={cache}", file=env_file)
      # Only scripts/schema_check.py needs a third-party package. The lock is
      # hash-pinned for every supported runner and interpreter in this matrix.
      - name: Install validation dependencies
        run: python -m pip install --require-hashes --requirement requirements-validation.lock
      # README and CI call the same runner so the Download ZIP contract cannot
      # silently lose a check when this workflow changes.
      - name: Run canonical archive-safe validation suite
        run: python scripts/validate_repo.py
      - name: Check diff whitespace (Git checkout only)
        run: git diff --check

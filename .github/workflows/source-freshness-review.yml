name: source-freshness-review

# Staleness of references/source-registry.md is a real signal, but it is a
# property of the calendar rather than of any commit. Enforcing it inside
# validate-skills.yml made unrelated pull requests fail on a date boundary, so
# the question is asked here instead: on a schedule, against the default
# branch, where a failure means "a human should re-verify the sources" rather
# than "this change is broken".
#
# This job never edits the registry. Bumping last_verified without actually
# re-reading the upstream sources would assert a verification that did not
# happen, which is exactly what the registry exists to prevent.

on:
  schedule:
    # Mondays at 09:00 UTC. The warning threshold is 14 days and the failure
    # threshold is 30, so a weekly cadence surfaces a drifting registry at
    # least twice before it is considered stale.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-freshness-review
  cancel-in-progress: false

jobs:
  review:
    # Scheduled workflows only ever run on the default branch, but this keeps
    # a manual dispatch from reporting a feature branch as the source of truth.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/seedance-pycache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Review source freshness
        id: review
        shell: bash
        run: |
          set -uo pipefail
          # `shell: bash` already runs with -e, so guard the call rather than
          # reading $? afterwards: a bare failure would abort the step before
          # the summary is written.
          status=0
          python scripts/source_registry_check.py --strict --enforce-freshness \
            > /tmp/freshness.txt 2>&1 || status=$?
          cat /tmp/freshness.txt

          # The checker warns before it fails: 14 days drifting, 30 days stale.
          # Exit status alone cannot tell a clean registry from a drifting one,
          # and reporting drift as "no action needed" would waste the early
          # warning this schedule exists to deliver.
          warned=0
          grep -q '^WARNINGS:' /tmp/freshness.txt && warned=1

          {
            echo "# Source freshness review"
            echo
            if [[ $status -eq 0 && $warned -eq 0 ]]; then
              echo "References are within the freshness window. No action needed."
              echo
              echo '```'
              cat /tmp/freshness.txt
              echo '```'
            elif [[ $status -eq 0 ]]; then
              echo "**references/source-registry.md is drifting.**"
              echo
              echo "Still inside the freshness window, so nothing is blocked yet."
              echo "Re-verifying now avoids a release being blocked later."
              echo
              echo '```'
              cat /tmp/freshness.txt
              echo '```'
            else
              echo "**references/source-registry.md needs re-verification.**"
              echo
              echo '```'
              cat /tmp/freshness.txt
              echo '```'
              echo
              echo "## What to do"
              echo
              echo "1. Re-read the upstream sources listed in \`references/source-registry.md\`."
              echo "2. Correct any claim that has changed, and re-stamp the rows you actually checked."
              echo "3. Update \`last_verified\` **only** for sources you genuinely re-read."
              echo
              echo "Editing the date without re-reading the sources would record a"
              echo "verification that never happened. A stale-but-honest registry is"
              echo "more useful than a fresh-looking one that nobody checked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
